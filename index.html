<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!--THE WHOLE MUSIC PLAYER INCLUDING THE GRAY BACKGROUND-->
    <div class="container">
        <div class="music-player">
            
            <!--BACK AND MENU BUTTONS ON THE TOP-->
            <nav>
                <div class="circle">
                    <i class="fa-solid fa-angle-left"></i>
                </div>
                <div class="circle">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>
                
            <!--Skrillex image-->
            <img src="skrillex.png" class="songimg">
                
            <!--SONG NAME-->    
            <h1>Kill 'Em</h1>
                
            <!--ARTIST NAME-->
            <p>Skrillex ft. Space Laces</p>
                
            <!-- ACTUAL AUDIO AND CONTROLS-->
            <audio id="song">
                <source src="Skrillex _ SPACE LACES - Kill Em.m4a" type="audio/mpeg">
            </audio>
                
            <!--AUDIO PROGRESS BAR-->
            <input type="range" value="0" id="prog">
              
            <!--AUDIO CONTROL BUTTONS-->
            <div class="controls">
                <div><i class="fa-solid fa-backward"></i></div>
                <div onclick="playpause()"><i class="fa-solid fa-play" id="ctrlicon"></i></div>    
                <div><i class="fa-solid fa-forward"></i></div>
            </div>

        </div>
    </div>

    <!--ATTACHING FAKE CONTROLS TO THE ACTUAL CONTROLS OF THE MUSIC PLAYER-->
    <script src="script.js"></script>
</body>
</html>
